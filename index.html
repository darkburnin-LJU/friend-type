<style>
:root{
  --bg:#FAF8F4; --surface:#FFFFFF; --surface-2:#F1EFE8; --line:#E2DED3;
  --fg:#1E211F; --muted:#6F7471;
  --accent:#2F6F62; --accent-soft:#E6F0EC;
  --warm:#B4762A;
  --display:"Gowun Batang",'Nanum Myeongjo',serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1B201E; --surface-2:#242A27; --line:#303733;
  --fg:#ECF0ED; --muted:#99A19D;
  --accent:#6FC3B0; --accent-soft:#1E2B28;
  --warm:#DCA95E;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1B201E; --surface-2:#242A27; --line:#303733;
  --fg:#ECF0ED; --muted:#99A19D;
  --accent:#6FC3B0; --accent-soft:#1E2B28;
  --warm:#DCA95E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.6;margin:0}
.wrap{max-width:620px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:none;border-radius:999px;
  padding:13px 26px;font-weight:700;letter-spacing:.01em}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);font-weight:700}

/* 시작 화면 */
.hero h1{font-size:clamp(30px,8vw,44px);line-height:1.25;margin:14px 0 0}
.hero p{color:var(--muted);margin:16px 0 0}
.steps{display:grid;gap:12px;margin:28px 0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;font-size:14px}
.steps b{font-family:var(--display);color:var(--accent);font-size:16px}

/* 문항 화면 */
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.count{font-family:var(--display);font-size:15px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.qtext{font-size:clamp(20px,5.2vw,26px);line-height:1.4;margin:16px 0 28px}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;min-height:58px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 18px;font-size:15.5px;color:var(--fg);
  transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:500}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:30px}

/* 결과 카드 — 캡처해서 올리는 용도 */
#card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;
  padding:34px 24px 28px;text-align:center}
#card .code{font-family:var(--display);font-weight:700;font-size:clamp(52px,15vw,72px);
  line-height:1;letter-spacing:.04em;color:var(--accent)}
#card .tname{font-family:var(--display);font-weight:700;
  font-size:clamp(22px,6vw,30px);line-height:1.3;margin-top:16px}
#card .line{color:var(--muted);font-size:15px;margin-top:12px}
#card hr{border:0;border-top:1px solid var(--line);margin:26px 4px}
#card .desc{text-align:left;font-size:14.5px;margin:0;color:var(--fg)}
#card .desc p{margin:0 0 9px}
#card .desc p:last-child{margin-bottom:0}
#card .brand{margin:26px 0 0;padding-top:18px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);letter-spacing:.02em}

/* 축 막대 */
.axes{display:grid;gap:16px;margin-top:26px;text-align:left}
.ax{font-size:12.5px;color:var(--muted)}
.ax .lb{display:flex;justify-content:space-between;margin-bottom:6px}
.ax .lb b{font-weight:700;color:var(--fg);font-size:13px}
.ax .lb em{font-style:normal;font-weight:700;font-size:13px;color:var(--accent);margin-left:5px;
  font-variant-numeric:tabular-nums}
.track{position:relative;height:6px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:999px}
.track i{position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;
  background:var(--accent);transform:translateX(-50%);transition:left .4s}
.track u{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line)}

/* 궁합 */
.match{display:grid;gap:10px;margin-top:30px}
.mt{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 12px 12px 0;padding:14px 18px;font-size:14.5px}
.mt.bad{border-left-color:var(--warm)}
.mt span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.mt b{font-weight:500}
.note{font-size:12.5px;color:var(--muted);margin-top:34px;
  padding-top:18px;border-top:1px solid var(--line)}
.svstat{font-size:12.5px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6;
  white-space:pre-line}
.fbimg{display:block;width:100%;max-width:330px;margin:14px auto 0;
  border:1px solid var(--line);border-radius:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<section id="s-intro">

    <p>25개 문항에 답하면 여덟 가지 유형 중 하나가 나옵니다.<br>돈, 약속, 거리감, 고민 들어주는 방식으로 나눴습니다.</p>
  </div>

  <p class="note">답은 아무 데도 저장되지 않습니다. 새로고침하면 사라집니다. 방문 수만 익명으로 집계됩니다.</p>
</section>

<!-- 문항 -->
<section id="s-quiz" hidden>
  <div class="bar"><i id="prog"></i></div>
  <div class="qhead">
    <p class="eyebrow" id="qeye">문항</p>
    <p class="count" id="qnum">1 / 25</p>
  </div>
  <h2 class="qtext" id="qtext"></h2>
  <div class="opts" id="qopts"></div>
  <div class="nav">

  </div>
</section>

<!-- 결과 -->
<section id="s-result" hidden>
  <div id="card">

    <p class="tname" id="rname"></p>
    <p class="line" id="rline"></p>
    <hr>
    <div class="desc" id="rdesc"></div>
    <div class="axes" id="raxes"></div>
    <p class="brand" id="brand">내 친구 유형 테스트</p>
  </div>

  <div class="match" id="rmatch"></div>

  <div class="row" style="margin-top:28px;justify-content:center">
    <button class="btn" id="svimg" onclick="saveImage()">이미지 저장</button>
    <button class="btn ghost" id="cplink" onclick="copyLink()">링크 복사</button>
    <button class="btn ghost" onclick="again()">다시 하기</button>
  </div>
  <p class="svstat" id="svstat" hidden></p>
  <img class="fbimg" id="fbimg" hidden alt="결과 카드">

  <p class="note">재미로 만든 테스트입니다. 심리 검사가 아닙니다.<br>만든 사람 · 엘제유</p>
</section>

/* 거리감·기준이 같고 역할이 반대면 잘 맞는다. 셋 다 반대면 부딪힌다 */
const GOOD={BOF:'BOL',BOL:'BOF',BEF:'BEL',BEL:'BEF',SOF:'SOL',SOL:'SOF',SEF:'SEL',SEL:'SEF'};
const BAD ={BOF:'SEL',SEL:'BOF',BOL:'SEF',SEF:'BOL',BEF:'SOL',SOL:'BEF',BEL:'SOF',SOF:'BEL'};

const AXIS={
 A:{hi:'가깝게',lo:'거리 두고',name:'거리감',max:16},
 C:{hi:'칼같이',lo:'느슨하게',name:'기준',max:16},
 D:{hi:'해결',  lo:'경청',    name:'역할',max:18}
};

let order=[], ans=[], cur=0, last=null;

/* 매번 문항 순서를 섞는다 (Fisher-Yates) */
function shuffle(n){
  const a=[]; for(let i=0;i<n;i++)a.push(i);
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function show(id){
  ['intro','quiz','result'].forEach(function(n){
    document.getElementById('s-'+n).hidden=(n!==id);
  });
  window.scrollTo(0,0);
}

function start(){
  order=shuffle(Q.length);
  ans=new Array(Q.length).fill(null);
  cur=0; last=null;
  render(); show('quiz');
  try{history.pushState({s:'quiz'},'')}catch(e){}
}

function render(){
  const q=Q[order[cur]];
  document.getElementById('prog').style.width=((cur)/Q.length*100)+'%';
  document.getElementById('qnum').textContent=(cur+1)+' / '+Q.length;
  document.getElementById('qtext').textContent=q.t;
  document.getElementById('prev').hidden=(cur===0);
  const box=document.getElementById('qopts');
  box.textContent='';
  q.o.forEach(function(o,i){
    const b=document.createElement('button');
    b.className='opt'; b.type='button'; b.textContent=o[0];
    b.setAttribute('aria-pressed', ans[order[cur]]===i?'true':'false');
    b.onclick=function(){ pick(i) };
    box.appendChild(b);
  });
}

function pick(i){
  ans[order[cur]]=i;
  render();
  setTimeout(function(){
    if(cur>=Q.length-1){ finish(); }
    else { cur++; render(); window.scrollTo(0,0); }
  },180);
}

function back(){
  if(cur>0){ cur--; render(); window.scrollTo(0,0); }
}

function score(){
  const s={A:0,C:0,D:0};
  for(let i=0;i<Q.length;i++){
    const a=ans[i]; if(a===null)continue;
    s[Q[i].x]+=Q[i].o[a][1];
  }
  return s;
}

function finish(){
  const s=score();
  const code=(s.A>=0?'B':'S')+(s.C>=0?'O':'E')+(s.D>=0?'F':'L');
  last={code:code,s:s};
  draw();
  show('result');
  try{history.pushState({s:'result'},'')}catch(e){}
}

function draw(){
  const t=TYPES[last.code];
  document.getElementById('rcode').textContent=last.code;
  document.getElementById('rname').textContent=t.n;
  document.getElementById('rline').textContent='"'+t.l+'"';

  const d=document.getElementById('rdesc'); d.textContent='';
  t.d.forEach(function(line){
    const p=document.createElement('p'); p.textContent=line; d.appendChild(p);
  });

  const ax=document.getElementById('raxes'); ax.textContent='';
  ['A','C','D'].forEach(function(k){
    const cfg=AXIS[k], v=last.s[k];
    const pct=Math.round((1-(v+cfg.max)/(cfg.max*2))*100); // 왼쪽(hi)일수록 0에 가깝게
    /* 치우친 쪽이 몇 %인지. 0점이면 50%, 만점이면 100% */
    const pw=Math.round(50+Math.abs(v)/cfg.max*50);
    const box=document.createElement('div'); box.className='ax';
    const lb=document.createElement('div'); lb.className='lb';
    function side(text,win){
      const s=document.createElement('span');
      if(win){
        const b=document.createElement('b'); b.textContent=text; s.appendChild(b);
        const e=document.createElement('em'); e.textContent=pw+'%'; s.appendChild(e);
      } else s.textContent=text;
      return s;
    }
    lb.appendChild(side(cfg.hi, v>=0));
    lb.appendChild(side(cfg.lo, v<0));
    const tr=document.createElement('div'); tr.className='track';
    const mid=document.createElement('u');
    const dot=document.createElement('i'); dot.style.left=pct+'%';
    tr.appendChild(mid); tr.appendChild(dot);
    box.appendChild(lb); box.appendChild(tr);
    ax.appendChild(box);
  });

  const m=document.getElementById('rmatch'); m.textContent='';
  m.appendChild(matchRow('잘 맞는 친구', GOOD[last.code], false));
  m.appendChild(matchRow('부딪히는 친구', BAD[last.code], true));

  const st=document.getElementById('svstat'); st.textContent=''; st.hidden=true;
  document.getElementById('fbimg').hidden=true;
  document.getElementById('svimg').textContent='이미지 저장';
  document.getElementById('cplink').textContent='링크 복사';
}

function matchRow(label, code, bad){
  const el=document.createElement('div');
  el.className='mt'+(bad?' bad':'');
  const s=document.createElement('span'); s.textContent=label;
  const b=document.createElement('b'); b.textContent=code+' · '+TYPES[code].n;
  el.appendChild(s); el.appendChild(b);
  return el;
}

/* ── 저장용 카드 그리기 ──────────────────────────
   캡처해서 올리는 용도라 다크모드에서도 색을 고정한다
   ───────────────────────────────────────────── */
function fit(x,text,max,size,weight,font){
  let s=size;
  x.font=weight+' '+s+'px '+font;
  while(x.measureText(text).width>max && s>18){ s-=2; x.font=weight+' '+s+'px '+font }
}
function roundRect(x,l,t,w,h,r){
  x.beginPath();
  x.moveTo(l+r,t); x.lineTo(l+w-r,t); x.quadraticCurveTo(l+w,t,l+w,t+r);
  x.lineTo(l+w,t+h-r); x.quadraticCurveTo(l+w,t+h,l+w-r,t+h);
  x.lineTo(l+r,t+h); x.quadraticCurveTo(l,t+h,l,t+h-r);
  x.lineTo(l,t+r); x.quadraticCurveTo(l,t,l+r,t); x.closePath();
}
function drawCard(){
  const W=1000,H=1250,c=document.createElement('canvas');
  c.width=W;c.height=H;
  const x=c.getContext('2d');
  const BG='#FAF8F4',FG='#1E211F',MUT='#6F7471',AC='#2F6F62',LINE='#E2DED3',TRK='#F1EFE8';
  const D='"Gowun Batang",serif', B='"Noto Sans KR",sans-serif';
  const t=TYPES[last.code];

  x.fillStyle=BG;x.fillRect(0,0,W,H);
  x.strokeStyle=LINE;x.lineWidth=2;x.strokeRect(40,40,W-80,H-80);
  x.textAlign='center';x.textBaseline='alphabetic';

  x.fillStyle=AC;x.font='700 30px '+B;
  x.fillText('내 친구 유형 테스트',W/2,152);

  x.fillStyle=AC;x.font='700 190px '+D;
  x.fillText(last.code,W/2,362);

  x.fillStyle=FG; fit(x,t.n,820,58,'700',D);
  x.fillText(t.n,W/2,448);

  const quote='"'+t.l+'"';
  x.fillStyle=MUT; fit(x,quote,820,30,'400',B);
  x.fillText(quote,W/2,504);

  x.strokeStyle=LINE;x.lineWidth=2;
  x.beginPath();x.moveTo(220,578);x.lineTo(W-220,578);x.stroke();

  const L=160, R=W-160, SPAN=R-L;
  ['A','C','D'].forEach(function(k,i){
    const cfg=AXIS[k], v=last.s[k];
    const pw=Math.round(50+Math.abs(v)/cfg.max*50);
    const pos=(1-(v+cfg.max)/(cfg.max*2));   // 왼쪽으로 치우칠수록 0에 가깝다
    const ly=682+i*128, ty=ly+30;

    if(v>=0){
      x.textAlign='left';
      x.fillStyle=FG; x.font='700 30px '+B; x.fillText(cfg.hi,L,ly);
      const w=x.measureText(cfg.hi).width;
      x.fillStyle=AC; x.fillText(pw+'%',L+w+14,ly);
      x.textAlign='right';
      x.fillStyle=MUT; x.font='400 30px '+B; x.fillText(cfg.lo,R,ly);
    }else{
      x.textAlign='left';
      x.fillStyle=MUT; x.font='400 30px '+B; x.fillText(cfg.hi,L,ly);
      x.textAlign='right';
      x.fillStyle=AC; x.font='700 30px '+B; x.fillText(pw+'%',R,ly);
      const w=x.measureText(pw+'%').width;
      x.fillStyle=FG; x.fillText(cfg.lo,R-w-14,ly);
    }

    x.fillStyle=TRK; x.strokeStyle=LINE; x.lineWidth=2;
    roundRect(x,L,ty,SPAN,12,6); x.fill(); x.stroke();
    x.strokeStyle=LINE; x.beginPath();
    x.moveTo(L+SPAN/2,ty-5); x.lineTo(L+SPAN/2,ty+17); x.stroke();
    x.fillStyle=AC; x.beginPath(); x.arc(L+SPAN*pos,ty+6,15,0,7); x.fill();
  });

  x.textAlign='center';
  x.strokeStyle=LINE;x.lineWidth=2;
  x.beginPath();x.moveTo(380,1090);x.lineTo(W-380,1090);x.stroke();
  /* 주소는 넣지 않는다. 긴 영문 주소가 한글 카드에서 눈에 거슬린다 */
  x.fillStyle=MUT;x.font='400 27px '+B;
  x.fillText('제작자 : 엘제유',W/2,1160);
  return c;
}

/* 클로드 아티팩트 안에서는 일반 다운로드가 막혀 있고, 이 기능이 그 통로다.
   준비되는 데 시간이 걸리므로 화면이 열릴 때 미리 받아둔다 */
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||
          (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
/* 카톡·인스타 같은 앱 안의 브라우저는 다운로드를 막는다.
   그럴 때는 그림을 화면에 띄워서 길게 눌러 저장하게 한다.
   여기 안 적힌 앱도 있어서, 저장이 다 실패했을 때도 같은 길로 빠진다 */
const INAPP=/KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER|DaumApps|Threads|everytimeApp/i
            .test(navigator.userAgent);
function showImage(c){
  try{
    const im=document.getElementById('fbimg');
    im.src=c.toDataURL('image/png');   // blob 주소는 앱 안에서 길게 눌러 저장이 안 된다
    im.hidden=false;
    im.scrollIntoView({block:'nearest',behavior:'smooth'});
    return true;
  }catch(e){ return false }
}

let dlCap=null;
try{
  if(window.claude&&typeof claude.use==='function')
    claude.use('downloads').then(function(d){dlCap=d}).catch(function(){});
}catch(e){}

/* 터치 기기: 클로드 저장 -> 다운로드
   PC      : 저장 위치 선택 창 -> 클로드 저장 -> 다운로드 */
async function saveImage(){
  if(!last)return;
  const b=document.getElementById('svimg'), st=document.getElementById('svstat');
  const say=function(t){ st.textContent=t||''; st.hidden=!t };
  const reset=function(msg,hold){
    b.disabled=false; b.textContent=msg||'이미지 저장';
    if(msg)setTimeout(function(){b.textContent='이미지 저장'},hold||2400);
  };
  b.disabled=true; b.textContent='만드는 중…'; say('');

  document.getElementById('fbimg').hidden=true;

  let blob=null, card=null;
  try{
    try{await document.fonts.ready}catch(e){}
    card=drawCard();
    blob=await new Promise(function(res){ if(card.toBlob)card.toBlob(res,'image/png'); else res(null) });
  }catch(e){}
  if(!blob){ reset('저장 안 됨'); say('그림을 만들지 못했습니다. 화면을 캡처해 주세요.'); return }

  /* 앱 안의 브라우저면 다운로드를 시도해봐야 오류만 뜨므로 바로 그림을 띄운다 */
  if(INAPP && showImage(card)){
    reset();
    say('카톡·인스타 안에서는 바로 저장이 안 됩니다.\n아래 그림을 길게 눌러 저장해 주세요.');
    return;
  }

  const name='friend-'+last.code+'.png';   // 파일명에 한글을 쓰면 일부 브라우저가 이름을 버린다
  const touch=window.matchMedia?matchMedia('(pointer:coarse)').matches:false;

  const viaClaude=async function(){
    if(!dlCap)return 'none';
    try{ const r=await dlCap.save({filename:name,data:blob}); return (r&&r.status)||'saved' }
    catch(e){ return 'ERR:'+((e&&e.code)||'unknown') }
  };
  const viaPicker=async function(){
    try{
      if(!window.showSaveFilePicker)return 'none';
      const h=await window.showSaveFilePicker({suggestedName:name,
        types:[{description:'PNG 이미지',accept:{'image/png':['.png']}}]});
      const w=await h.createWritable(); await w.write(blob); await w.close();
      return 'saved';
    }catch(e){ return 'ERR:'+((e&&e.name)||'unknown') }
  };
  const viaLink=function(){
    try{
      const u=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=u; a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){try{URL.revokeObjectURL(u)}catch(e){}},5000);
      return 'requested';   // 브라우저에 넘긴 것까지만 확인된다
    }catch(e){ return 'ERR:'+((e&&e.name)||'unknown') }
  };

  const plan = touch
    ? [['클로드',viaClaude],['다운로드',viaLink]]
    : [['저장창',viaPicker],['클로드',viaClaude],['다운로드',viaLink]];

  const log=[];
  for(let i=0;i<plan.length;i++){
    const r=await plan[i][1]();
    if(r==='none'){ log.push(plan[i][0]+':없음'); continue }
    log.push(plan[i][0]+':'+r);
    if(r==='requested'){
      reset('저장됨');
      if(IOS){ say('저장이 안 됐으면 카드를 화면 캡처해 주세요');
               setTimeout(function(){ if(st.textContent.indexOf('캡처')>=0)say('') },7000) }
      else say('');
      return;
    }
    if(r==='saved'||r==='delivered'){ reset('저장됨'); say(''); return }
    if(r==='ERR:AbortError'||r==='ERR:declined'){ reset(); say(''); return }   // 취소는 오류가 아니다
  }
  if(showImage(card)){
    reset();
    say('바로 저장이 안 됩니다.\n아래 그림을 길게 눌러 저장해 주세요.');
    return;
  }
  reset('저장 안 됨');
  say('저장에 실패했습니다. 화면을 캡처해 주세요. [' + log.join(' / ') + ']');
}

/* 공유창을 띄우지 않고 클립보드에 바로 넣는다.
   공유창은 운영체제가 그리는 화면이라 내용을 우리가 정할 수 없어서 복사로 통일했다 */
function btnFlash(b,msg){
  if(!b.dataset.label)b.dataset.label=b.textContent;
  b.textContent=msg;
  setTimeout(function(){b.textContent=b.dataset.label},2000);
}
async function copyLink(){
  if(!last)return;
  const t=TYPES[last.code], b=document.getElementById('cplink');
  const text='내 친구 유형 : '+last.code+' · '+t.n+'\n'+SITE;
  try{ await navigator.clipboard.writeText(text); btnFlash(b,'복사됨'); return }catch(e){}
  try{   // 클립보드 권한이 막힌 환경 대비
    const a=document.createElement('textarea');
    a.value=text; a.style.position='fixed'; a.style.top='-1000px'; a.style.opacity='0';
    document.body.appendChild(a); a.focus(); a.select();
    const ok=document.execCommand('copy'); a.remove();
    btnFlash(b, ok?'복사됨':'복사 안 됨');
  }catch(e){ btnFlash(b,'복사 안 됨') }
}

function again(){ show('intro'); }

/* 뒤로가기로 사이트를 벗어나지 않게 한다 */
window.addEventListener('popstate',function(ev){
  const st=ev.state;
  if(!st){ show('intro'); return; }
  if(st.s==='quiz'){ if(last){ show('intro') } else { show('quiz') } }
  else show(st.s);
});
try{history.replaceState({s:'intro'},'')}catch(e){}
